name: Build Complete System Design EPUB

on:
  workflow_dispatch:

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc, Fonts and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk
          python3 -m pip install pillow

      - name: Build Kindle-Optimized EPUB with Cool Cover
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import subprocess
          import random
          from PIL import Image, ImageDraw, ImageFont

          # 1. 自动生成极简分布式架构蓝图封面 (1600x2560 高清)
          width, height = 1600, 2560
          img = Image.new("RGB", (width, height), color="#0f172a")
          draw = ImageDraw.Draw(img)

          random.seed(42)
          nodes = []
          for _ in range(35):
              nodes.append((random.randint(100, width - 100), random.randint(950, height - 250)))

          for i in range(len(nodes)):
              for j in range(i + 1, len(nodes)):
                  dist = ((nodes[i][0] - nodes[j][0])**2 + (nodes[i][1] - nodes[j][1])**2)**0.5
                  if dist < 320:
                      draw.line([nodes[i], nodes[j]], fill="#334155", width=2)

          for nx, ny in nodes:
              draw.ellipse([nx-12, ny-12, nx+12, ny+12], fill="#1e293b", outline="#64748b", width=3)
              draw.ellipse([nx-4, ny-4, nx+4, ny+4], fill="#f8fafc")

          font_path = "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"
          if not os.path.exists(font_path):
              font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          f_tag = ImageFont.truetype(font_path, 42)
          f_title_en = ImageFont.truetype(font_path, 110)
          f_title_cn = ImageFont.truetype(font_path, 76)
          f_sub = ImageFont.truetype(font_path, 46)
          f_author = ImageFont.truetype(font_path, 40)

          draw.rectangle([60, 60, width - 60, height - 60], outline="#475569", width=4)
          draw.line([100, 480, width - 100, 480], fill="#38bdf8", width=6)

          draw.rectangle([100, 140, 520, 210], fill="#1e293b", outline="#38bdf8", width=2)
          draw.text((125, 152), "DISTRIBUTED SYSTEMS", fill="#38bdf8", font=f_tag)

          draw.text((100, 240), "SYSTEM DESIGN", fill="#ffffff", font=f_title_en)
          draw.text((100, 360), "INTERVIEW GUIDE", fill="#94a3b8", font=f_title_en)

          draw.text((100, 530), "系统设计面试：内幕指南", fill="#ffffff", font=f_title_cn)
          draw.text((100, 640), "全集典藏版 · Volume 1 & Volume 2", fill="#38bdf8", font=f_sub)

          draw.rectangle([100, height - 200, width - 100, height - 198], fill="#334155")
          draw.text((100, height - 160), "AUTHOR: ALEX XU  |  COMMUNITY EDITION", fill="#94a3b8", font=f_author)
          draw.text((width - 450, height - 160), "KINDLE PW3 OPTIMIZED", fill="#64748b", font=f_author)

          cover_file = "cover.png"
          img.save(cover_file, "PNG")

          # 2. 修正 CSS：显式设置底色为纯白 #ffffff，杜绝黑底，同时解除字体锁定
          css_content = """
          @namespace "http://www.w3.org/1999/xhtml";
          html, body {
              background-color: #ffffff !important;
              color: #000000 !important;
              margin: 0;
              padding: 0;
              line-height: 1.6;
          }
          p, div, span, blockquote, pre, code {
              background-color: #ffffff !important;
              color: #000000 !important;
          }
          img {
              max-width: 100% !important;
              height: auto !important;
              display: block;
              margin: 1.5em auto;
          }
          h1, h2, h3 {
              page-break-before: always;
              text-align: left;
              color: #000000 !important;
          }
          """
          with open("kindle_clean.css", "w", encoding="utf-8") as f:
              f.write(css_content)

          # 3. 收集文件并构建 EPUB3
          vol1_files = sorted(glob.glob("CHAPTER*.md"))
          vol2_files = []
          if os.path.exists("Volume2"):
              vol2_files = sorted(glob.glob("Volume2/**/*.md", recursive=True))

          all_files = vol1_files + vol2_files

          cmd = [
              "pandoc",
              "-f", "gfm+east_asian_line_breaks",
              "-t", "epub3",  # 显式使用标准的 EPUB3 格式
              "-s",
              "--toc",
              "--toc-depth=2",
              "--split-level=1",
              "--epub-chapter-level=1",
              "--css=kindle_clean.css",
              f"--epub-cover-image={cover_file}",
              "--metadata", "title=系统设计面试：内幕指南（全集 Vol 1 & 2）",
              "--metadata", "author=Alex Xu (译者: Admol 社区)",
              # 注意：已移除会导致目录锚点断裂的 --file-scope
              "-o", "SystemDesign_Complete.epub"
          ] + all_files

          subprocess.run(cmd, check=True)
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemDesign_Complete_EPUB
          path: SystemDesign_Complete.epub
