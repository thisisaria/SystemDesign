name: Build Complete System Design EPUB

on:
  workflow_dispatch:

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build All-in-One EPUB via Python Runner
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import subprocess

          # 1. 获取 Volume 1 的章节（按文件名排序）
          vol1_files = sorted(glob.glob("CHAPTER*.md"))

          # 2. 获取 Volume 2 的章节（如果存在）
          vol2_files = []
          if os.path.exists("Volume2"):
              vol2_files = sorted(glob.glob("Volume2/**/*.md", recursive=True))

          all_files = vol1_files + vol2_files

          print(f"找到 {len(all_files)} 个章节文件：")
          for f in all_files:
              print(f" - {f}")

          # 3. 构造精准参数列表，避免空格断词
          cmd = [
              "pandoc",
              "-s",
              "--toc",
              "--metadata", "title=系统设计面试：内幕指南（全集 Vol 1 & 2）",
              "--metadata", "author=Alex Xu (译者: Admol 社区)",
              "--file-scope",
              "-o", "SystemDesign_Complete.epub"
          ] + all_files

          subprocess.run(cmd, check=True)
          EOF

      - name: Verify build output
        run: |
          ls -lh SystemDesign_Complete.epub

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemDesign_Complete_EPUB
          path: SystemDesign_Complete.epub
